# The healthchecks order `init`, so that `docker compose up -d` waits for the stack.
services:
  cache:
    image: redis
    restart: "unless-stopped"
    read_only: true
    command: redis-server --save ""
    ports:
      - "${CACHE_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
  db:
    image: postgres:18-alpine
    restart: "unless-stopped"
    environment:
      - "POSTGRES_USER=rero-ils"
      - "POSTGRES_PASSWORD=rero-ils"
      - "POSTGRES_DB=rero-ils"
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "rero-ils"]
      interval: 5s
      timeout: 5s
      retries: 12
    # Throwaway data: durability is traded for speed.
    command: >
      postgres
      -c fsync=off
      -c synchronous_commit=off
      -c full_page_writes=off
      -c wal_level=minimal
      -c max_wal_senders=0
  mq:
    image: rabbitmq:4.2-management
    restart: "unless-stopped"
    ports:
      - "${MQ_ADMIN_PORT:-15672}:15672"
      - "${MQ_PORT:-5672}:5672"
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
  os:
    build: ./docker/opensearch/
    image: rero-ils-os
    restart: "unless-stopped"
    environment:
      - bootstrap.memory_lock=true
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
      - "discovery.type=single-node"
      - "indices.query.bool.max_clause_count=65536"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    mem_limit: 3g
    ports:
      - "${OS_PORT:-9200}:9200"
      - "${OS_TRANSPORT_PORT:-9300}:9300"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9200/_cluster/health"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s
  # One shard and no replica for the development indices, merged into the `record`
  # template. tests/conftest.py restores it after the tests wipe the templates.
  init:
    image: curlimages/curl
    depends_on:
      cache:
        condition: service_healthy
      db:
        condition: service_healthy
      mq:
        condition: service_healthy
      os:
        condition: service_healthy
    command:
      - "-fsS"
      - "-X"
      - "PUT"
      - "http://os:9200/_template/dev-single-shard"
      - "-H"
      - "Content-Type: application/json"
      - "-d"
      - '{"index_patterns":["*-*"],"order":100,"settings":{"number_of_shards":1,"number_of_replicas":0}}'
  # Makes `up -d` wait for `init`: `up -d --wait` fails on an exited one-shot.
  gate:
    image: curlimages/curl
    entrypoint: ["true"]
    depends_on:
      init:
        condition: service_completed_successfully
