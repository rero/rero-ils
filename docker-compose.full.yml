services:
  # Load balancer
  lb:
    extends:
      file: docker-services.yml
      service: lb
    links:
      - frontend
  # Frontend
  frontend:
    extends:
      file: docker-services.yml
      service: frontend
    links:
      - web-ui
      - web-api
  # UI Application
  web-ui:
    extends:
      file: docker-services.yml
      service: app
    # Granian also serves /static, from the image.
    command: >
      uv run granian --interface wsgi --host 0.0.0.0 --port 5000
      --workers 2 --blocking-threads 2 --respawn-failed-workers --access-log
      --static-path-route /static --static-path-mount /invenio/var/instance/static
      invenio_app.wsgi_ui:application
    image: rero-ils-web-ui
    ports:
      - "5000:5000"
    links:
      - cache
      - os
      - mq
      - db
  # API Rest Application
  web-api:
    extends:
      file: docker-services.yml
      service: app
    command: >
      uv run granian --interface wsgi --host 0.0.0.0 --port 5001
      --workers 2 --blocking-threads 2 --respawn-failed-workers --access-log
      --url-path-prefix /api
      invenio_app.wsgi_rest:application
    image: rero-ils-web-api
    ports:
      - "5001"
    links:
      - cache
      - os
      - mq
      - db
  # Worker
  worker:
    extends:
      file: docker-services.yml
      service: app
    restart: "unless-stopped"
    command: "uv run celery --app rero_ils.celery worker --loglevel=INFO"
    image: rero-ils-worker
    links:
      - cache
      - os
      - mq
      - db
  # Beat
  beat:
    extends:
      file: docker-services.yml
      service: app
    restart: "unless-stopped"
    command: "uv run celery --app rero_ils.celery beat -S rero_ils.schedulers.DatabaseScheduler --loglevel=INFO"
    image: rero-ils-beat
    links:
      - cache
      - os
      - mq
      - db
  # Monitoring
  flower:
    extends:
      file: docker-services.yml
      service: flower
    links:
      - mq
  # Base services
  cache:
    extends:
      file: docker-services.yml
      service: cache
  db:
    extends:
      file: docker-services.yml
      service: db
  mq:
    extends:
      file: docker-services.yml
      service: mq
  os:
    extends:
      file: docker-services.yml
      service: os
