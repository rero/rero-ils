services:
  cache:
    image: redis
    restart: "unless-stopped"
    read_only: true
    command: redis-server --save ""
    ports:
      - "6379:6379"
  db:
    image: postgres:18-alpine
    restart: "unless-stopped"
    environment:
      - "POSTGRES_USER=rero-ils"
      - "POSTGRES_PASSWORD=rero-ils"
      - "POSTGRES_DB=rero-ils"
    ports:
      - "5432:5432"
  mq:
    image: rabbitmq:4.2-management
    restart: "unless-stopped"
    ports:
      - "15672:15672"
      - "5672:5672"
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
  os:
    build: ./docker/opensearch/
    image: rero-ils-os
    restart: "unless-stopped"
    environment:
      - bootstrap.memory_lock=true
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
      - "discovery.type=single-node"
      - "plugins.security.disabled=true"
      - "OPENSEARCH_INITIAL_ADMIN_PASSWORD=Str@wberry_77!"
      - "indices.query.bool.max_clause_count=65536"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    mem_limit: 3g
    ports:
      - "9200:9200"
      - "9300:9300"
